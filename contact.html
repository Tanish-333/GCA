<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · GCA Golden Triangle</title>
  <meta name="description" content="Get in touch with the Gujarati Cultural Association of the Golden Triangle about events, membership, volunteering or sponsorship.">
  <meta name="theme-color" content="#9f2a1f">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Vadodara:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Noto+Serif+Gujarati:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="contact">
  <a class="skip" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <header class="page-head">
      <div class="wrap">
        <p class="eyebrow">Contact</p>
        <p class="page-head__guj" lang="gu">કેમ છો?</p>
        <h1>Get in touch</h1>
        <p data-bind="pages.contactIntro">Questions about an event, membership, volunteering or sponsorship? Send us a note.</p>
      </div>
    </header>

    <section class="section section--tight">
      <div class="wrap two-col">
        <div class="panel">
          <form class="stack" id="contact-form" novalidate>
            <div class="form-grid">
              <div class="field"><label for="c-name">Name</label><input class="input" id="c-name" name="name" autocomplete="name" required></div>
              <div class="field"><label for="c-email">Email</label><input class="input" id="c-email" name="email" type="email" autocomplete="email" required></div>
              <div class="field"><label for="c-phone">Phone <span class="muted">(optional)</span></label><input class="input" id="c-phone" name="phone" type="tel" autocomplete="tel"></div>
              <div class="field">
                <label for="c-topic">Topic</label>
                <select class="select" id="c-topic" name="topic">
                  <option>General</option>
                  <option>Events</option>
                  <option>Membership</option>
                  <option>Volunteering</option>
                  <option>Sponsorship</option>
                  <option>Gujarati Shala</option>
                </select>
              </div>
              <div class="field span-2"><label for="c-message">Message</label><textarea class="textarea" id="c-message" name="message" required></textarea></div>
            </div>
            <button class="btn btn--primary" type="submit" style="justify-self:start">Send message</button>
          </form>
        </div>
        <aside>
          <p class="eyebrow">Reach us</p>
          <ul class="info-list" id="contact-info"></ul>
        </aside>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="data/content.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
